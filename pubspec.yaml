name: docscan
description: "DocScan - Smart Document Scanner & Text Extractor (Flutter)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Camera / image capture
  image_picker: ^1.1.2

  # On-device OCR (Google ML Kit Text Recognition)
  google_mlkit_text_recognition: ^0.13.0

  # Local database (stores document records)
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # PDF generation & export
  pdf: ^3.11.0
  printing: ^5.13.1

  # Utilities
  intl: ^0.19.0
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
